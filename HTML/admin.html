<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/admin.css">
    <title>Nour Academy - Dashboard</title>
</head>

<body>
    
    <section class="content">

        <div class="top">
            <div>
                <h1>Bienvenue dans Nour Academy</h1>
            </div>

            <input type="search" placeholder="Rechercher un étudiant...">
        </div>
        <div class="table-container">
            <h2>Liste des étudiants</h2>

            <table>
                <thead>
                    <tr>
                        <th>Nom complet</th>
                        <th>Niveau</th>
                        <th>Classe</th>
                        <th>Abonnement</th>
                        <th>Nember</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="liste-etudiants">

                </tbody>
            </table>
        </div>

    </section>
    <script src="../JS/js/admin.js" defer></script>
    <script src="../JS/js/students.js" defer></script>
     <script src="../JS/js/login.js"></script>
     <script src="../JS/js/dashboard.js"></script>
</body>


</html>
